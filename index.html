<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>四六级背单词 · 遗忘曲线 · 真题训练</title>
    <style>
        :root {

            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .app-container { max-width: 780px; margin: 0 auto; padding: 20px 16px 40px; position: relative; z-index: 1; }
        .app-header { text-align: center; padding: 28px 0 8px; }
        .app-header .logo { font-size: 2.2em; font-weight: 800; background: linear-gradient(135deg, #4f46e5, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .app-header .subtitle { font-size: 0.9em; color: var(--text-secondary); margin-top: 2px; }
        .tab-nav { display: flex; background: var(--card-bg); border-radius: var(--radius); padding: 5px; gap:4px; margin:16px 0; box-shadow: var(--shadow); position: sticky; top:16px; z-index:10; }
        .tab-btn { flex:1; padding:12px 8px; border:none; background:transparent; border-radius:calc(var(--radius)-4px); cursor:pointer; font-size:0.95em; font-weight:600; color:var(--text-secondary); transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; position:relative; }
        .tab-btn:hover { color:var(--text); background:rgba(79,70,229,0.04); }
        .tab-btn.active { background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(79,70,229,0.35); }
        .tab-badge { position:absolute; top:4px; right:8px; background:var(--danger); color:#fff; font-size:0.7em; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; animation:pulse-badge 2s ease-in-out infinite; }
        @keyframes pulse-badge { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
        .panel { display:none; animation: fadeSlideIn 0.4s ease; }
        .panel.active { display:block; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
        .stats-row { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom:20px; }
        .stat-card { background:var(--card-bg); border-radius:var(--radius-sm); padding:14px 10px; text-align:center; box-shadow:var(--shadow); transition:var(--transition); }
        .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
        .stat-card .stat-num { font-size:1.6em; font-weight:700; color:var(--primary); line-height:1; }
        .stat-card .stat-label { font-size:0.7em; color:var(--text-secondary); margin-top:4px; }
        .stat-card.mastered .stat-num { color:var(--success); } .stat-card.review .stat-num { color:var(--warning); } .stat-card.new-words .stat-num { color:#8b5cf6; }
        .word-card-container { perspective:1200px; margin:0 auto 20px; max-width:500px; }
        .word-card { width:100%; aspect-ratio:1.4/1; position:relative; cursor:pointer; transform-style:preserve-3d; transition:transform 0.6s; -webkit-tap-highlight-color:transparent; }
        .word-card.flipped { transform:rotateY(180deg); }
        .word-card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; box-shadow:var(--shadow-lg); overflow:hidden; }
        .word-card-front { background:linear-gradient(145deg,#fff,#f8fafc); border:2px solid var(--border); z-index:2; }
        .word-card-back { background:linear-gradient(145deg,#fefefe,#fdfcfb); border:2px solid #e8e4f0; transform:rotateY(180deg); z-index:1; }
        .card-word { font-size:2.6em; font-weight:800; color:var(--text); text-align:center; word-break:break-word; }
        .card-phonetic { font-size:1em; color:var(--text-secondary); margin-top:6px; font-family:monospace; }
        .card-meaning { font-size:1.5em; font-weight:700; color:#4f46e5; text-align:center; margin-bottom:6px; }
        .card-example { font-size:0.9em; color:#555; text-align:center; font-style:italic; margin-top:4px; }
        .card-stage-badge { position:absolute; top:14px; right:16px; font-size:0.7em; font-weight:600; padding:4px 10px; border-radius:20px; background:#eef2ff; color:#4f46e5; }
        .action-buttons { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
        .btn { padding:13px 28px; border:none; border-radius:30px; cursor:pointer; font-size:1em; font-weight:600; transition:var(--transition); display:flex; align-items:center; gap:6px; -webkit-tap-highlight-color:transparent; }
        .btn:active { transform:scale(0.94); }
        .btn-know { background:var(--success); color:#fff; box-shadow:0 4px 14px rgba(16,185,129,0.35); }
        .btn-dunno { background:#fff; color:var(--danger); border:2px solid var(--danger); }
        .btn-speak { background:#fff; color:var(--primary); border:2px solid var(--primary); padding:10px 18px; font-size:0.9em; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-outline { background:#fff; color:var(--primary); border:2px solid var(--border); }
        .reading-passage { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; font-size:0.95em; line-height:1.7; }
        .quiz-option { padding:12px 18px; border:2px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); background:#fafbfc; margin-top:8px; }
        .quiz-option.correct { border-color:var(--success)!important; background:#ecfdf5!important; }
        .quiz-option.wrong { border-color:var(--danger)!important; background:#fef2f2!important; }
        .listening-card { background:var(--card-bg); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow-lg); }
        .import-btn { background:#fff; color:var(--primary); border:2px dashed var(--primary); padding:10px 18px; border-radius:30px; cursor:pointer; font-size:0.85em; margin-left:8px; }
        .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:12px 24px; border-radius:30px; font-weight:600; z-index:999; animation:toastIn 0.4s ease, toastOut 0.4s ease 1.8s forwards; }

</head>
<body>
<div class="app-container">
    <header class="app-header"><div class="logo">📚 WordMaster</div><div class="subtitle">四六级 · 遗忘曲线 · 真题训练</div></header>
    <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="vocab">📝 背单词<span class="tab-badge" id="reviewBadge" style="display:none;">0</span></button>
        <button class="tab-btn" data-tab="reading">📖 阅读真题</button>
        <button class="tab-btn" data-tab="listening">🎧 听力真题</button>
    </nav>

    <!-- 背单词面板 -->
    <div class="panel active" id="panelVocab">
        <div class="stats-row">
            <div class="stat-card new-words"><div class="stat-num" id="statNew">0</div><div class="stat-label">📥 新词待学</div></div>
            <div class="stat-card review"><div class="stat-num" id="statReview">0</div><div class="stat-label">⏰ 待复习</div></div>
            <div class="stat-card mastered"><div class="stat-num" id="statMastered">0</div><div class="stat-label">✅ 已掌握</div></div>
            <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">📊 总词库</div></div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
            <select class="select-sm" id="levelSelect" style="padding:8px 14px; border-radius:20px; border:2px solid #e2e8f0;">
                <option value="all">📚 全部词库</option>
                <option value="CET4">📘 四级高频词</option>
                <option value="CET6">📙 六级高频词</option>
            </select>
            <select class="select-sm" id="dailyNewCount" style="padding:8px 14px; border-radius:20px; border:2px solid #e2e8f0;">
                <option value="10">每日新词:10</option><option value="15">每日新词:15</option><option value="20" selected>每日新词:20</option><option value="30">每日新词:30</option>
            </select>
            <button class="import-btn" id="btnImportWords">📥 导入完整词库JSON</button>
        </div>
        <div class="word-card-container" id="wordCardContainer">
            <div class="word-card" id="wordCard">
                <div class="word-card-face word-card-front"><div class="card-word" id="cardWord"></div><div class="card-phonetic" id="cardPhonetic"></div></div>
                <div class="word-card-face word-card-back"><span class="card-stage-badge" id="cardStageBadge">新词</span><div class="card-meaning" id="cardMeaning"></div><div class="card-example" id="cardExample"></div></div>
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-speak" id="btnSpeakCard">🔊 朗读</button>
            <button class="btn btn-dunno" id="btnDunno">😕 不认识</button>
            <button class="btn btn-know" id="btnKnow">😊 认识</button>
        </div>
        <div id="emptyVocab" style="display:none; text-align:center; padding:40px;">🎉 暂无待复习单词，请调整级别或导入更多词汇</div>
    </div>

    <!-- 阅读真题面板 -->
    <div class="panel" id="panelReading">
        <div class="reading-passage" id="readingPassageText"></div>
        <div id="readingQuestion" style="font-weight:600; margin:10px 0;"></div>
        <div id="readingOptions"></div>
        <div id="readingFeedback" style="margin-top:12px; font-weight:600;"></div>
        <button class="btn btn-primary" id="btnNextReading" style="display:none; margin-top:12px;">下一题 ➡️</button>
        <div style="margin-top:8px; color:var(--text-secondary);">正确率：<span id="readAccuracy">-</span> (已做<span id="readDone">0</span>题)</div>
        <button class="import-btn" id="btnImportReading" style="margin-top:8px;">📥 导入阅读真题JSON</button>
    </div>

    <!-- 听力真题面板 -->
    <div class="panel" id="panelListening">
        <div class="listening-card">
            <button class="btn btn-speak" id="btnPlayListenAudio" style="margin-bottom:12px;">🔊 播放听力原文</button>
            <div id="listenQuestion" style="font-weight:600; margin:8px 0;"></div>
            <div id="listenOptions"></div>
            <div id="listenFeedback" style="margin-top:10px; font-weight:600;"></div>
            <button class="btn btn-primary" id="btnNextListen" style="display:none; margin-top:10px;">下一题 ➡️</button>
        </div>
        <div style="margin-top:8px; color:var(--text-secondary);">正确率：<span id="listenAccuracy">-</span> (已做<span id="listenDone">0</span>题)</div>
        <button class="import-btn" id="btnImportListening" style="margin-top:8px;">📥 导入听力真题JSON</button>
    </div>
</div>

    // 状态与存储
    const STORAGE_KEY = 'wm_data_v3';
    function loadData() { try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : {}; } catch(e) { return {}; } }
    function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    let appData = loadData();
    if (!appData.words) appData.words = {}; // {id: {stage,nextReview,correctCount,...}}
    if (!appData.readStats) appData.readStats = {done:0,correct:0};
    if (!appData.listenStats) appData.listenStats = {done:0,correct:0};
    if (!appData.dailyNew) appData.dailyNew = {};
    const stageIntervals = [20, 60, 1440, 2880, 5760, 10080, 21600, 43200]; // 分钟
    const MASTERED_STAGE = 7;

    function getNextReview(stage) { return Date.now() + stageIntervals[Math.min(stage,7)]*60*1000; }
    function getWordRec(id) { return appData.words[id]; }
    function ensureWordRec(id) { if(!appData.words[id]) appData.words[id]={stage:-1,nextReview:0}; return appData.words[id]; }

    const today = () => new Date().toISOString().split('T')[0];
    function filteredWords() {
        const level = document.getElementById('levelSelect').value;
        if (level === 'all') return allWords;
        return allWords.filter(w => w.level === level);
    }
    function getReviewable() {
        const now = Date.now();
        return filteredWords().filter(w => { const r = getWordRec(w.id); return r && r.stage>=0 && r.nextReview<=now && r.stage<MASTERED_STAGE; });
    }
    function getNewRemaining() {
        const limit = parseInt(document.getElementById('dailyNewCount').value)||20;
        const todayLearned = appData.dailyNew[today()] || 0;
        const unlearned = filteredWords().filter(w => { const r = getWordRec(w.id); return !r || r.stage<0; });
        return { words: unlearned, remaining: Math.max(0, limit - todayLearned) };
    }

    // UI更新
    function refreshVocab() {
        const reviewable = getReviewable();
        const newInfo = getNewRemaining();
        document.getElementById('statNew').textContent = Math.min(newInfo.remaining, newInfo.words.length);
        document.getElementById('statReview').textContent = reviewable.length;
        document.getElementById('statMastered').textContent = filteredWords().filter(w=>{const r=getWordRec(w.id);return r&&r.stage>=MASTERED_STAGE;}).length;
        document.getElementById('statTotal').textContent = filteredWords().length;
        const badge = document.getElementById('reviewBadge');
        if(reviewable.length>0){ badge.style.display='flex'; badge.textContent=reviewable.length; } else badge.style.display='none';

        const word = selectWord();
        if(word) showWordCard(word);
        else { document.getElementById('wordCardContainer').style.display='none'; document.getElementById('emptyVocab').style.display=''; }
    }
    function selectWord() {
        const reviewable = getReviewable();
        if(reviewable.length) return reviewable.sort((a,b)=>(getWordRec(a.id)?.nextReview||0)-(getWordRec(b.id)?.nextReview||0))[0];
        const newInfo = getNewRemaining();
        if(newInfo.remaining>0 && newInfo.words.length) return newInfo.words[Math.floor(Math.random()*newInfo.words.length)];
        return null;
    }
    let currentWord = null, isFlipped = false;
    function showWordCard(w) {
        currentWord = w; isFlipped = false;
        document.getElementById('wordCardContainer').style.display='';
        document.getElementById('emptyVocab').style.display='none';
        document.getElementById('cardWord').textContent = w.word;
        document.getElementById('cardPhonetic').textContent = w.phonetic || '';
        document.getElementById('cardMeaning').textContent = w.meaning;
        document.getElementById('cardExample').textContent = w.example || '';
        document.getElementById('wordCard').classList.remove('flipped');
        const rec = getWordRec(w.id);
        const stages = ['🔄阶段0','⏱阶段1','📅阶段2','📅阶段3','📅阶段4','📅阶段5','🗓阶段6','⭐已掌握'];
        document.getElementById('cardStageBadge').textContent = rec&&rec.stage>=0 ? stages[Math.min(rec.stage,7)] : '🆕新词';
    }
    function handleKnow() {
        if(!currentWord) return;
        const rec = ensureWordRec(currentWord.id);
        const wasNew = rec.stage < 0;
        if(rec.stage < MASTERED_STAGE) rec.stage = Math.min(rec.stage+1, MASTERED_STAGE);
        rec.nextReview = getNextReview(rec.stage);
        rec.correctCount = (rec.correctCount||0)+1;
        if(wasNew) { const td = today(); appData.dailyNew[td] = (appData.dailyNew[td]||0)+1; }
        saveData(appData); refreshVocab();
        showToast('✅ 认识！'+(rec.stage<MASTERED_STAGE?'下次复习已安排':'恭喜掌握！'));
    }
    function handleDunno() {
        if(!currentWord) return;
        const rec = ensureWordRec(currentWord.id);
        rec.stage = 0; rec.nextReview = getNextReview(0); rec.wrongCount = (rec.wrongCount||0)+1;
        saveData(appData); refreshVocab();
        showToast('😕 不认识，20分钟后复习');
    }
    document.getElementById('wordCard').addEventListener('click', ()=>{
        if(!currentWord) return;
        isFlipped = !isFlipped;
        document.getElementById('wordCard').classList.toggle('flipped', isFlipped);
    });
    document.getElementById('btnKnow').onclick = ()=>{ if(!isFlipped){ isFlipped=true; document.getElementById('wordCard').classList.add('flipped'); setTimeout(handleKnow,300); } else handleKnow(); };
    document.getElementById('btnDunno').onclick = ()=>{ if(!isFlipped){ isFlipped=true; document.getElementById('wordCard').classList.add('flipped'); setTimeout(handleDunno,300); } else handleDunno(); };
    document.getElementById('btnSpeakCard').onclick = ()=>{
        if(!currentWord) return;
        const u = new SpeechSynthesisUtterance(currentWord.word); u.lang='en-US'; speechSynthesis.speak(u);
    };

    // 阅读真题
    let currentReading = null, readAnswered = false;
    function loadReading() {
        currentReading = readingPassages[Math.floor(Math.random()*readingPassages.length)];
        document.getElementById('readingPassageText').textContent = currentReading.passage;
        document.getElementById('readingQuestion').textContent = currentReading.question;
        const opts = document.getElementById('readingOptions');
        opts.innerHTML = currentReading.options.map((o,i)=>`<div class="quiz-option" data-idx="${i}">${String.fromCharCode(65+i)}. ${o}</div>`).join('');
        document.getElementById('readingFeedback').textContent = '';
        document.getElementById('btnNextReading').style.display = 'none';
        readAnswered = false;
        opts.querySelectorAll('.quiz-option').forEach(el=> el.onclick = function(){
            if(readAnswered) return;
            readAnswered = true;
            const idx = parseInt(this.dataset.idx);
            const correct = idx === currentReading.answer;
            appData.readStats.done++; if(correct) appData.readStats.correct++;
            saveData(appData);
            opts.querySelectorAll('.quiz-option').forEach(o=>{ if(parseInt(o.dataset.idx)===currentReading.answer) o.classList.add('correct'); else if(parseInt(o.dataset.idx)===idx && !correct) o.classList.add('wrong'); });
            document.getElementById('readingFeedback').textContent = correct ? '✅ 正确！' : `❌ 错误！正确答案是 ${String.fromCharCode(65+currentReading.answer)}`;
            document.getElementById('btnNextReading').style.display = '';
            updateReadStats();
        });
    }
    function updateReadStats() {
        document.getElementById('readAccuracy').textContent = appData.readStats.done ? Math.round(appData.readStats.correct/appData.readStats.done*100)+'%' : '-';
        document.getElementById('readDone').textContent = appData.readStats.done;
    }
    document.getElementById('btnNextReading').onclick = loadReading;

    // 听力真题
    let currentListen = null, listenAnswered = false;
    function loadListening() {
        currentListen = listeningTasks[Math.floor(Math.random()*listeningTasks.length)];
        document.getElementById('listenQuestion').textContent = currentListen.question;
        const opts = document.getElementById('listenOptions');
        opts.innerHTML = currentListen.options.map((o,i)=>`<div class="quiz-option" data-idx="${i}">${String.fromCharCode(65+i)}. ${o}</div>`).join('');
        document.getElementById('listenFeedback').textContent = '';
        document.getElementById('btnNextListen').style.display = 'none';
        listenAnswered = false;
        opts.querySelectorAll('.quiz-option').forEach(el=> el.onclick = function(){
            if(listenAnswered) return;
            listenAnswered = true;
            const idx = parseInt(this.dataset.idx);
            const correct = idx === currentListen.answer;
            appData.listenStats.done++; if(correct) appData.listenStats.correct++;
            saveData(appData);
            opts.querySelectorAll('.quiz-option').forEach(o=>{ if(parseInt(o.dataset.idx)===currentListen.answer) o.classList.add('correct'); else if(parseInt(o.dataset.idx)===idx && !correct) o.classList.add('wrong'); });
            document.getElementById('listenFeedback').textContent = correct ? '✅ 正确！' : `❌ 错误！正确答案是 ${String.fromCharCode(65+currentListen.answer)}`;
            document.getElementById('btnNextListen').style.display = '';
            updateListenStats();
        });
    }
    function updateListenStats() {
        document.getElementById('listenAccuracy').textContent = appData.listenStats.done ? Math.round(appData.listenStats.correct/appData.listenStats.done*100)+'%' : '-';
        document.getElementById('listenDone').textContent = appData.listenStats.done;
    }
    document.getElementById('btnPlayListenAudio').onclick = ()=>{
        if(!currentListen) return;
        const u = new SpeechSynthesisUtterance(currentListen.script); u.lang='en-US'; speechSynthesis.speak(u);
    };
    document.getElementById('btnNextListen').onclick = loadListening;

    // 导入功能
    function importJSON(callback) {
        const input = document.createElement('input'); input.type='file'; input.accept='.json';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = ev => {
                try { const data = JSON.parse(ev.target.result); callback(data); } catch(ex) { showToast('JSON解析错误'); }
            };
            reader.readAsText(file);
        };
        input.click();
    }
    document.getElementById('btnImportWords').onclick = ()=> importJSON(data => {
        if(data.words && Array.isArray(data.words)) {
            allWords = [...allWords, ...data.words];
            showToast(`成功导入${data.words.length}个单词`);
            refreshVocab();
        } else showToast('格式错误，需要 { "words": [...] }');
    });
    document.getElementById('btnImportReading').onclick = ()=> importJSON(data => {
        if(data.passages && Array.isArray(data.passages)) {
            readingPassages = [...readingPassages, ...data.passages];
            showToast(`导入${data.passages.length}篇阅读`);
        }
    });
    document.getElementById('btnImportListening').onclick = ()=> importJSON(data => {
        if(data.tasks && Array.isArray(data.tasks)) {
            listeningTasks = [...listeningTasks, ...data.tasks];
            showToast(`导入${data.tasks.length}道听力题`);
        }
    });

    // 标签切换
    document.getElementById('tabNav').addEventListener('click', e => {
        const btn = e.target.closest('.tab-btn'); if(!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        document.getElementById('panel'+btn.dataset.tab.charAt(0).toUpperCase()+btn.dataset.tab.slice(1)).classList.add('active');
        if(btn.dataset.tab==='vocab') refreshVocab();
        else if(btn.dataset.tab==='reading') { if(!currentReading) loadReading(); updateReadStats(); }
        else if(btn.dataset.tab==='listening') { if(!currentListen) loadListening(); updateListenStats(); }
    });

    document.getElementById('levelSelect').onchange = refreshVocab;
    document.getElementById('dailyNewCount').onchange = refreshVocab;

    function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
        setTimeout(()=>t.remove(), 2200);
    }
    // 初始加载
    refreshVocab();
    loadReading();
    loadListening();
})();
</script>
</body>
</html>
